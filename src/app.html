<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#FFC9DE" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Escritorio: scroll horizontal. Celular: vertical. Se decide antes de pintar.
			if (
				matchMedia('(min-width: 1024px)').matches &&
				!matchMedia('(prefers-reduced-motion: reduce)').matches
			) {
				document.documentElement.classList.add('horiz');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
